---
name: build-src

on: [push, pull_request, workflow_dispatch]

concurrency: ci-${{ github.ref }}

jobs:
  broker-client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Broker client tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure standalone broker tests
        run: cmake -S test/hostpid_broker -B build-broker -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-broker
      - name: Test
        run: ctest --test-dir build-broker --output-on-failure -V

  hook-registry-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Hook static consistency check
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Run CUDA hook static consistency check
        run: python3 hack/check_cuda_hook_consistency.py

  BuildHamiCoreLib:
    needs: [hook-registry-check]
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    strategy:
      fail-fast: true
    name: Build libvgpu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        run: |
          make build-in-docker
